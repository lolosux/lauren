<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confidential Data Rails — Whitepaper</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: #fff;
        color: #000;
      }

      body {
        font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      }

      #stage {
        position: relative;
        max-width: 760px;
        margin: 0 auto;
        min-height: 100vh;
        padding-bottom: 60px;
      }

      .wp-title {
        position: absolute;
        font-style: italic;
        font-size: 28px;
        line-height: 36px;
        text-align: center;
      }

      .wp-subtitle {
        position: absolute;
        font-size: 17px;
        line-height: 24px;
        text-align: center;
      }

      .wp-version {
        position: absolute;
        font-size: 16px;
        line-height: 22px;
        text-align: center;
      }

      .wp-author-name {
        position: absolute;
        font-size: 15px;
        line-height: 20px;
        text-align: center;
      }

      .wp-author-email {
        position: absolute;
        font-family: "Courier New", Courier, monospace;
        font-size: 11.5px;
        line-height: 16px;
        text-align: center;
      }

      .wp-abstract-header {
        position: absolute;
        font-size: 16px;
        font-weight: bold;
        line-height: 22px;
        text-align: center;
      }

      .wp-section-number {
        position: absolute;
        font-size: 21px;
        font-weight: bold;
        line-height: 28px;
      }

      .wp-section-title {
        position: absolute;
        font-size: 21px;
        font-weight: bold;
        line-height: 28px;
      }

      .wp-body-line {
        position: absolute;
        white-space: pre;
        font-size: 16px;
        line-height: 23px;
        font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        user-select: text;
        cursor: text;
      }

      .wp-page-number {
        position: absolute;
        font-size: 16px;
        line-height: 20px;
        text-align: center;
      }

      .wp-obstacle {
        position: absolute;
        border: 2px dashed #ccc;
        border-radius: 4px;
        background: #f9f9f9;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./whitepaper.ts"></script>
  </body>
</html>
